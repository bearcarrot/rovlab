name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # tests are plain node:test files (no extra deps); includes the CSP hash check for index.html
      - run: npm test
      # vite build only: the full `npm run build` also runs prerender-meta.mjs, which needs the live database
      - run: npx vite build
