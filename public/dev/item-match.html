<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ทดสอบจับคู่ไอเทม</title>
<style>
  body{font:14px system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:12px}
  h1{font-size:18px;margin:0 0 6px} p{margin:6px 0;color:#aaa}
  .row{margin:10px 0;padding:8px;background:#1b1b24;border-radius:8px}
  .row b{display:block;margin-bottom:6px;font-size:13px}
  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .c{background:#242433;border-radius:6px;padding:4px;font-size:11px;line-height:1.25;word-break:break-word}
  .c canvas{width:44px;height:44px;display:block;margin-bottom:3px}
  .ok{outline:2px solid #3ecf6e}.mid{outline:2px solid #e8a33d}.bad{outline:2px solid #e5484d}.em{opacity:.5}
  small{color:#888}
</style>
</head>
<body>
<h1>ทดสอบจับคู่ไอเทมจากสกรีนชอต</h1>
<p id="st">กำลังโหลดไอคอน…</p>
<input id="f" type="file" accept="image/*" multiple disabled>
<p><small>ขอบเขียว = ระยะห่าง &lt; 0.15 (มั่นใจ), เหลือง &lt; 0.30, แดง = ไม่แน่ใจ ตัวเลขคือระยะห่าง ยิ่งน้อยยิ่งตรง</small></p>
<div id="out"></div>
<script>
const API='https://mttcdaiwuasnkqlxbeqs.supabase.co',KEY='sb_publishable_O0_-OBjGvv4mEqXsTNMrfw_LeRFeeJK';
// Slot centres measured on a 2576x1191 scoreboard; scaled by image size so other resolutions work too.
const W0=2576,H0=1191,HALF=33;
const LX=[665,754,843,933,1022,1111],RX=[1728,1818,1907,1996,2086,2175],RY=[333,486,638,791,943];
const $=id=>document.getElementById(id);
const cv=document.createElement('canvas');cv.width=cv.height=32;
const cx=cv.getContext('2d',{willReadFrequently:true});
// 20x20 centre of the 32x32 slot: skips the frame, so catalogue icons and in-game icons compare on the artwork only
function vec(src,sx,sy,sw,sh){cx.clearRect(0,0,32,32);cx.drawImage(src,sx,sy,sw,sh,0,0,32,32);
  const d=cx.getImageData(6,6,20,20).data,v=[];for(let i=0;i<d.length;i+=4)v.push(d[i],d[i+1],d[i+2]);return v}
function unit(v){const m=v.reduce((a,b)=>a+b,0)/v.length,c=v.map(x=>x-m);let n=0;for(const x of c)n+=x*x;n=Math.sqrt(n)||1;return c.map(x=>x/n)}
function flat(v){let s=0;for(let ch=0;ch<3;ch++){let m=0;for(let i=ch;i<v.length;i+=3)m+=v[i];m/=400;let q=0;for(let i=ch;i<v.length;i+=3)q+=(v[i]-m)**2;s+=Math.sqrt(q/400)}return s/3<12}
const load=src=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src});
let items=[];
async function init(){
  const r=await fetch(API+'/rest/v1/items?select=name,name_th,icon_url',{headers:{apikey:KEY}});
  const rows=await r.json();let fail=0;
  await Promise.all(rows.map(async it=>{try{const im=await load(it.icon_url);
    items.push({label:it.name_th||it.name,u:unit(vec(im,0,0,im.naturalWidth,im.naturalHeight))})}catch(e){fail++}}));
  $('st').textContent='โหลดไอคอนแล้ว '+items.length+' ชิ้น'+(fail?' (โหลดไม่ได้ '+fail+')':'')+' เลือกรูปสกรีนชอตได้เลย';
  $('f').disabled=false;
}
function best(v){const u=unit(v);let a=[9,''],b=[9,''];
  for(const it of items){let d=0;for(let i=0;i<u.length;i++)d+=u[i]*it.u[i];d=1-d;
    if(d<a[0]){b=a;a=[d,it.label]}else if(d<b[0])b=[d,it.label]}return [a,b]}
async function run(file){
  const bmp=await createImageBitmap(file),sx=bmp.width/W0,sy=bmp.height/H0;
  const wrap=document.createElement('div');wrap.innerHTML='<h1>'+file.name+'</h1>';
  let n={ok:0,mid:0,bad:0,em:0};
  for(const [team,xs] of [['ทีมฟ้า',LX],['ทีมแดง',RX]])RY.forEach((y,r)=>{
    const row=document.createElement('div');row.className='row';row.innerHTML='<b>'+team+' แถว '+(r+1)+'</b>';
    const g=document.createElement('div');g.className='g';
    xs.forEach(x=>{
      const v=vec(bmp,(x-HALF)*sx,(y-HALF)*sy,2*HALF*sx,2*HALF*sy),c=document.createElement('div');c.className='c';
      const t=document.createElement('canvas');t.width=t.height=44;
      t.getContext('2d').drawImage(bmp,(x-HALF)*sx,(y-HALF)*sy,2*HALF*sx,2*HALF*sy,0,0,44,44);c.appendChild(t);
      if(flat(v)){c.classList.add('em');c.append('ว่าง');n.em++}
      else{const [a,b]=best(v),k=a[0]<.15?'ok':a[0]<.3?'mid':'bad';n[k]++;c.classList.add(k);
        c.append(a[1]+' ('+a[0].toFixed(2)+')');const s=document.createElement('small');s.textContent=' หรือ '+b[1]+' ('+b[0].toFixed(2)+')';c.appendChild(document.createElement('br'));c.appendChild(s)}
      g.appendChild(c)});
    row.appendChild(g);wrap.appendChild(row)});
  const sum=document.createElement('p');sum.textContent='มั่นใจ '+n.ok+' · เหลือง '+n.mid+' · ไม่แน่ใจ '+n.bad+' · ว่าง '+n.em;
  wrap.insertBefore(sum,wrap.children[1]);$('out').appendChild(wrap)}
$('f').onchange=async e=>{$('out').innerHTML='';$('st').textContent='กำลังจับคู่…';
  try{for(const f of e.target.files)await run(f);$('st').textContent='เสร็จแล้ว เลื่อนดูแถวของคุณแล้วเทียบกับ build จริง'}
  catch(err){$('st').textContent='ผิดพลาด: '+err.message}};
init().catch(e=>$('st').textContent='โหลดไอคอนไม่สำเร็จ: '+e.message);
</script>
</body>
</html>
