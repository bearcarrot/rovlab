    <!-- PSI: เปิดการเชื่อมต่อ (DNS+TLS) ไปยัง Supabase ล่วงหน้า ระหว่างที่ JS ยังโหลดอยู่ เพื่อลดเวลา request ข้อมูลชุดแรก (ต้องมี crossorigin เพราะ supabase-js ใช้ fetch แบบ CORS) -->
    <link rel="preconnect" href="https://mttcdaiwuasnkqlxbeqs.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint: the stylesheet is fetched as print-only, then switched to all media once loaded (by the inline script at the end of <body>, not an onload attribute, so CSP needs no 'unsafe-inline'). display=swap keeps text visible meanwhile. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
      media="print"
      id="fonts-css"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>
    <!-- PSI: สไตล์ขั้นต่ำสำหรับหน้าจอเริ่มต้น (#boot) ให้เบราว์เซอร์ paint ได้ทันทีที่ parse HTML เสร็จ โดยไม่ต้องรอ JS/CSS หลัก
         CSS หลักของแอปถูก inline เข้า <head> ตอน build (ดู vite.config.ts) -->
    <style>
      html,body{margin:0;background:#0a0b0e;color:#f2f3f5}
      #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;font:600 20px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em}
    </style>
  </head>
  <body>
    <!-- React (createRoot) จะแทนที่เนื้อหาใน #root ทั้งหมดเมื่อแอปเริ่มทำงาน -->
    <div id="root"><div id="boot" aria-hidden="true">RoV LAB</div></div>
    <script>
      // กู้จอค้างที่ "RoV LAB": ถ้าแอปไม่ขึ้นใน 8 วิ (เช่น ไฟล์ JS เก่า/แคชเสีย หลัง deploy ใหม่) โหลดหน้าใหม่ 1 ครั้ง
      // ถ้ายังไม่ขึ้นอีก แสดงปุ่มโหลดใหม่แทนจอดำ
      (function () {
        // ฟอนต์: สลับ media เป็น all เมื่อโหลดเสร็จ (แทน onload attribute เพื่อให้ CSP ไม่ต้องใช้ 'unsafe-inline')
        var fonts = document.getElementById("fonts-css");
        if (fonts) {
          if (fonts.sheet) fonts.media = "all";
          else fonts.addEventListener("load", function () { fonts.media = "all"; });
        }
        function reloadOnce() {
          try {
            if (sessionStorage.getItem("boot-reload")) return false;
            sessionStorage.setItem("boot-reload", "1");
          } catch (e) { return false; }
          location.reload();
          return true;
        }
        window.addEventListener("vite:preloadError", function () { reloadOnce(); });
        setTimeout(function () {
          var boot = document.getElementById("boot");
          if (!boot) { try { sessionStorage.removeItem("boot-reload"); } catch (e) {} return; }
          if (reloadOnce()) return;
          boot.innerHTML = '<div style="text-align:center">RoV LAB<br><a href="/" style="font-size:14px;color:inherit">โหลดหน้าใหม่</a></div>';
          boot.removeAttribute("aria-hidden");
        }, 8000);
      })();
    </script>
    <script>
      // PSI: ยิงคำขอ Supabase ของหน้าแรกตั้งแต่ parse HTML (ขนานกับการโหลด JS) แทนที่จะรอให้ bundle รันก่อน
      // src/lib/supabase.ts จะหยิบผลที่ prefetch ไว้ไปใช้ครั้งเดียว (URL + Accept ต้องตรงเป๊ะ) ถ้าไม่ตรง/พลาดก็ยิงปกติ
      (function () {
        try {
          if (location.pathname !== "/" || !window.fetch) return;
          function meta(n) { var e = document.querySelector('meta[name="' + n + '"]'); return e ? e.content : ""; }
          var base = meta("sb-url"), key = meta("sb-key");
          if (!base || !key || base.charAt(0) === "%" || key.charAt(0) === "%") return;
          var rank = "all";
          try {
            var q = new URLSearchParams(location.search).get("rank");
            var s = q || localStorage.getItem("rovlab.rank");
            if (s === "all" || s === "high" || s === "pro") rank = s;
          } catch (e) {}
          // ข้าม prefetch เมื่อผลจะถูกทิ้ง: ล็อกอินอยู่ (supabase-js ส่ง JWT ผู้ใช้ แต่ prefetch ใช้ anon key จึงใช้ซ้ำไม่ได้ แอปยิงใหม่เอง)
          try { if (localStorage.getItem("sb-" + base.replace(/^https?:\/\//, "").split(".")[0] + "-auth-token")) return; } catch (e) {}
          // และเมื่อแคช localStorage ของ ttlCache ยังสด (แอปไม่ยิงชุดนี้เลย) — prefix/อายุต้องตรง PERSIST_KEY และ PERSIST_TTL_MS / LONG_PERSIST_TTL_MS ใน src/lib/ttlCache.ts
          // (heroes:<rank> = 6 ชม. = 21600000, balance:recent = 15 นาที = 900000)
          function fresh(k, ttl) {
            try { var c = JSON.parse(localStorage.getItem("rovlab:cache:v2:" + k)); return !!c && Date.now() - c.at < ttl; } catch (e) { return false; }
          }
          var store = (window.__earlyFetch = {});
          function get(table, params) {
            var qs = new URLSearchParams(params).toString();
            var u = base + "/rest/v1/" + table + "?" + qs;
            // ยิงผ่าน /api/sb (Vercel CDN แคชไว้ ลด egress ของ Supabase) แต่ยังใช้ URL ตรงของ Supabase เป็น key ให้ supabase.ts หยิบไปใช้
            var p = fetch("/api/sb?t=" + table + "&q=" + encodeURIComponent(qs), { headers: { Accept: "application/json" } }).then(function (r) {
              if (!r.ok || (r.headers.get("content-type") || "").indexOf("json") < 0) throw new Error(String(r.status));
              return r;
            });
            p.catch(function () {});
            store[u] = { p: p, t: Date.now() };
            return p;
          }
          function json(p) { return p.then(function (r) { return r.clone().json(); }); }
          // heroes:<rank> (รายชื่อ + สถิติ + tier) สดอยู่ = แอปไม่ยิง heroes/patches/hero_stats/tier_lists เลย จึงไม่ prefetch ชุดนี้
          var heroesFresh = fresh("heroes:" + rank, 21600000);
          if (!heroesFresh) get("heroes", [["select", "id,slug,name,name_th,role,lane,roles,lanes,difficulty,icon_url"], ["order", "name.asc"]]);
          if (!fresh("balance:recent", 900000)) get("hero_balance_changes", [["select", "hero_id,kind,changed_at"], ["changed_at", "gte." + new Date(Date.now() - 60 * 86400000).toISOString().slice(0, 10)], ["order", "changed_at.desc"]]);
          if (heroesFresh) return;
          json(get("patches", [["select", "id,code,released_at"], ["order", "released_at.desc.nullslast"], ["limit", "1"]])).then(function (rows) {
            var id = rows && rows[0] && rows[0].id;
            if (!id) return;
            get("hero_stats", [["select", "hero_id,rank_tier,win_rate,pick_rate,ban_rate,tier,matches"], ["rank_tier", "eq." + rank], ["patch_id", "eq." + id]]);
            return json(get("tier_lists", [["select", "id,lane"], ["patch_id", "eq." + id], ["rank_tier", "eq." + rank]])).then(function (lists) {
              if (!lists || !lists.length) return;
              get("tier_list_entries", [["select", "tier_list_id,hero_id,tier"], ["tier_list_id", "in.(" + lists.map(function (l) { return l.id; }).join(",") + ")"]]);
            });
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
